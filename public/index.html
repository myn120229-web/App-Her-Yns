<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>unemployed · Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background: linear-gradient(135deg, #0f0c29, #1e1b4b); color: #e0e7ff; }
        .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        .tab-btn.active { background: rgba(0,212,170,0.15); color: #00d4aa; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #6b7280; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col">
    <header class="glass rounded-2xl p-4 mb-4 shadow-xl flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center text-xl">🧭</div>
            <div>
                <h1 class="text-xl font-bold text-sky-400">unemployed</h1>
                <p class="text-xs text-slate-400">Mini App · remote job finder</p>
            </div>
        </div>
        <span id="model-badge" class="text-xs text-slate-500"></span>
    </header>

    <nav class="glass rounded-xl p-2 mb-4 flex flex-wrap gap-1">
        <button class="tab-btn active px-3 py-2 rounded-lg text-sm" data-tab="profile">👤 پروفایل</button>
        <button class="tab-btn px-3 py-2 rounded-lg text-sm" data-tab="search">🔍 جستجو</button>
        <button class="tab-btn px-3 py-2 rounded-lg text-sm" data-tab="matches">🎯 matches</button>
        <button class="tab-btn px-3 py-2 rounded-lg text-sm" data-tab="resume">📄 رزومه</button>
        <button class="tab-btn px-3 py-2 rounded-lg text-sm" data-tab="config">⚙️ تنظیم API</button>
    </nav>

    <main class="flex-1 overflow-y-auto space-y-4">
        <!-- PROFILE -->
        <section id="profile" class="glass rounded-xl p-4">
            <h2 class="font-bold text-sky-400 mb-3">پروفایل و دانش‌بیس</h2>
            <textarea id="profile-json" rows="18" class="w-full bg-transparent border border-slate-600 rounded-lg p-2 text-xs font-mono" dir="ltr" placeholder='{"name": "...", "knowledge_base": [...]}"></textarea>
            <button id="save-profile" class="mt-3 bg-sky-500 hover:bg-sky-400 text-white px-4 py-2 rounded-lg text-sm">💾 ذخیره پروفایل</button>
            <p id="profile-msg" class="text-xs text-emerald-400 mt-2"></p>
        </section>

        <!-- SEARCH -->
        <section id="search" class="glass rounded-xl p-4 hidden">
            <h2 class="font-bold text-sky-400 mb-3">جستجوی شغل</h2>
            <div class="flex gap-2">
                <input id="search-kw" class="flex-1 bg-transparent border border-slate-600 rounded-lg p-2 text-sm" dir="rtl" placeholder="کلمه کلیدی (مثلاً python)">
                <button id="run-search" class="bg-sky-500 hover:bg-sky-400 text-white px-4 py-2 rounded-lg text-sm">جستجو</button>
            </div>
            <p id="search-msg" class="text-xs text-slate-400 mt-2"></p>
        </section>

        <!-- MATCHES -->
        <section id="matches" class="glass rounded-xl p-4 hidden">
            <h2 class="font-bold text-sky-400 mb-3">مشاغل منطبق</h2>
            <div id="matches-list" class="space-y-2 text-sm"></div>
        </section>

        <!-- RESUME -->
        <section id="resume" class="glass rounded-xl p-4 hidden">
            <h2 class="font-bold text-sky-400 mb-3">تولید رزومه PDF</h2>
            <button id="gen-resume" class="bg-sky-500 hover:bg-sky-400 text-white px-4 py-2 rounded-lg text-sm">📄 ساخت رزومه</button>
            <div id="resume-out" class="mt-3 space-y-1 text-xs"></div>
            <a id="resume-link" class="hidden mt-2 inline-block text-sky-400 underline" href="/api/resume.pdf">⬇️ دانلود PDF</a>
        </section>

        <!-- CONFIG -->
        <section id="config" class="glass rounded-xl p-4 hidden">
            <h2 class="font-bold text-sky-400 mb-3">تنظیم endpoint و API key</h2>
            <label class="block text-xs text-slate-400 mb-1">Base URL (OpenAI-compatible)</label>
            <input id="cfg-url" class="w-full bg-transparent border border-slate-600 rounded-lg p-2 text-xs mb-3" dir="ltr" placeholder="https://api.zyloo.io/v1">
            <label class="block text-xs text-slate-400 mb-1">API Key</label>
            <input id="cfg-key" class="w-full bg-transparent border border-slate-600 rounded-lg p-2 text-xs mb-3" dir="ltr" placeholder="sk-...">
            <label class="block text-xs text-slate-400 mb-1">Model</label>
            <input id="cfg-model" class="w-full bg-transparent border border-slate-600 rounded-lg p-2 text-xs mb-3" dir="ltr" placeholder="gpt-4o-mini">
            <button id="save-config" class="bg-emerald-500 hover:bg-emerald-400 text-white px-4 py-2 rounded-lg text-sm">💾 ذخیره تنظیمات</button>
            <p id="cfg-msg" class="text-xs text-emerald-400 mt-2"></p>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
